name: Deploy to Cloudflare

on:
  push:
    tags:
      - "Release-*"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Validate release tag
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import datetime
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"Release-([0-9]{6})-([1-9][0-9]*)", tag)
          if not match:
              raise SystemExit("::error::Expected Release-YYMMDD-INDEX, with INDEX starting at 1 and no leading zeros.")
          try:
              datetime.datetime.strptime("20" + match[1], "%Y%m%d")
          except ValueError:
              raise SystemExit("::error::Release tag must contain a valid calendar date.")
          print(f"Validated release tag: {tag}")

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm check

      - name: Deploy Worker and assets without managing custom domains
        run: pnpm --filter @workspace/worker run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
