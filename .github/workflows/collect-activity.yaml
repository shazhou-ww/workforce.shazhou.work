name: Collect public GitHub activity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-activity
  cancel-in-progress: false

jobs:
  collect:
    if:
      github.event_name == 'workflow_dispatch' || vars.WORKFORCE_SYNC_ENABLED ==
      'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect a complete snapshot
        run: pnpm collect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACCOUNTS: ${{ vars.GITHUB_ACCOUNTS || 'shazhou-ww' }}
          GITHUB_AUTHOR_LOGIN:
            ${{ vars.WORKFORCE_AUTHOR_LOGIN || 'shazhou-ww' }}
          GITHUB_AUTHOR_EMAILS: ${{ vars.WORKFORCE_AUTHOR_EMAILS }}
      - name: Save an offline snapshot without publishing over the Worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-snapshot
          path: .data/snapshot.json
