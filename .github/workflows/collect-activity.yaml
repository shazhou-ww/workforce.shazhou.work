name: Collect public GitHub activity

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-activity
  cancel-in-progress: false

jobs:
  collect:
    if:
      github.event_name == 'workflow_dispatch' || vars.WORKFORCE_SYNC_ENABLED ==
      'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect a complete snapshot
        run: pnpm collect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACCOUNTS: ${{ vars.GITHUB_ACCOUNTS || 'shazhou-ww' }}
          GITHUB_AUTHOR_LOGIN:
            ${{ vars.WORKFORCE_AUTHOR_LOGIN || 'shazhou-ww' }}
          GITHUB_AUTHOR_EMAILS: ${{ vars.WORKFORCE_AUTHOR_EMAILS }}
      - name: Publish only after successful collection
        working-directory: apps/worker
        run:
          pnpm exec wrangler kv key put activity:v1 --binding STATS --path
          ../../.data/snapshot.json --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
